# Local quality and security gate (ADR-0008). Install once: `pre-commit install`.
# Update hook versions with `pre-commit autoupdate` (and review the diff).
repos:
  # Secrets: block any commit that contains a credential (also covers docs/sessions/).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system        # uses the installed binary: `brew install gitleaks`
        pass_filenames: false      # it scans the staged diff itself

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Shell scripts (hooks and tools) are code too.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # GitHub Actions security: unpinned actions, template injection, excessive permissions, etc.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
